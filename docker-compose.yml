services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wonder
      POSTGRES_PASSWORD: wonder
      POSTGRES_DB: wonder_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wonder -d wonder_crm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
